<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A workspace for sharing prototypes and gathering structured feedback from evaluators.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="In Cantiere">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>In Cantiere — Project reviews</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #070a12; }
    #startup { position: fixed; inset: 0; display: grid; place-items: center; z-index: 2; }
    .startup-panel {
      box-sizing: border-box;
      width: min(340px, calc(100% - 32px));
      padding: 22px;
      border: 1px solid #36465c;
      border-radius: 17px;
      background: linear-gradient(135deg, #1d293a, #111824);
      color: #dce8f7;
      font: 14px system-ui, sans-serif;
    }
    .startup-line {
      height: 11px;
      margin: 10px 0 0;
      border-radius: 7px;
      background: #53657b;
      animation: startup-pulse 950ms ease-in-out infinite alternate;
    }
    @keyframes startup-pulse { from { opacity: .45; } to { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { .startup-line { animation: none; } }
  </style>
</head>
<body>
  <div id="startup" role="status" aria-label="Loading In Cantiere">
    <div class="startup-panel">
      <div class="startup-line" aria-hidden="true" style="width: 70%"></div>
      <div class="startup-line" aria-hidden="true" style="width: 48%"></div>
    </div>
  </div>
  <script>
    const startup = document.getElementById('startup');
    const startupTimeout = setTimeout(() => {
      startup.querySelector('.startup-panel').textContent = 'Still loading. If this continues, reload the page.';
    }, 20000);
    window.addEventListener('flutter-first-frame', () => {
      clearTimeout(startupTimeout);
      startup.remove();
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
